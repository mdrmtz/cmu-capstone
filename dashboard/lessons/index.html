<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons from Fixed Tickets - A11y Fixer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #ffffff;
            --color-bg-secondary: #f8f9fa;
            --color-text: #1a1a1a;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-success: #10b981;
            --color-info: #3b82f6;
            --color-shadow: rgba(0, 0, 0, 0.05);
            --color-shadow-lg: rgba(0, 0, 0, 0.1);
        }

        html.dark-mode {
            --color-bg: #1a1a1a;
            --color-bg-secondary: #2d2d2d;
            --color-text: #ffffff;
            --color-text-secondary: #a0aec0;
            --color-border: #404040;
            --color-shadow: rgba(255, 255, 255, 0.05);
            --color-shadow-lg: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--color-success) 0%, #059669 100%);
            color: white;
            padding: 2rem;
            box-shadow: 0 2px 8px var(--color-shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 0.875rem;
            opacity: 0.95;
            margin-top: 0.25rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 0.625rem 1rem;
            color: white;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-2px);
        }

        .theme-toggle {
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            color: white;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
        }

        .theme-toggle:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .lesson-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .lesson-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px var(--color-shadow-lg);
            border-color: var(--color-success);
        }

        .lesson-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--color-text);
        }

        .lesson-description {
            color: var(--color-text-secondary);
            font-size: 0.9375rem;
            margin-bottom: 1rem;
        }

        .lesson-tag {
            display: inline-block;
            background: var(--color-info);
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--color-text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .modal-overlay.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-dialog {
            background: var(--color-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--color-success) 0%, #059669 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .modal-header-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 2rem;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        /* Markdown Content Styling */
        .markdown-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem;
            color: var(--color-text);
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1.25rem 0 0.75rem;
            color: var(--color-text);
        }

        .markdown-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1rem 0 0.5rem;
            color: var(--color-text);
        }

        .markdown-content p {
            margin-bottom: 1rem;
            color: var(--color-text);
            line-height: 1.7;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 1rem 0 1rem 2rem;
            color: var(--color-text);
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .markdown-content code {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 0.2rem 0.4rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #d946ef;
        }

        .markdown-content pre {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .markdown-content pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--color-text);
            font-size: 0.85rem;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--color-success);
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            background: var(--color-bg-secondary);
            border-radius: 4px;
            color: var(--color-text-secondary);
            font-style: italic;
        }

        .markdown-content strong {
            font-weight: 700;
            color: var(--color-text);
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content a {
            color: var(--color-info);
            text-decoration: none;
            border-bottom: 1px solid var(--color-info);
            transition: all 0.2s ease;
        }

        .markdown-content a:hover {
            opacity: 0.8;
        }

        .markdown-content hr {
            border: none;
            border-top: 2px solid var(--color-border);
            margin: 2rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--color-border);
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <div class="header-title">📚 Lessons from Fixed Tickets</div>
                <div class="header-subtitle">Knowledge base of accessibility fixes and techniques</div>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="../index.html" class="back-btn">
                    <span>←</span>
                    <span>Back</span>
                </a>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="lessons-grid" id="lessonsContainer">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Loading lessons...</p>
            </div>
        </div>
    </main>

    <!-- Content Modal -->
    <div class="modal-overlay" id="contentModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <div class="modal-header-title" id="modalTitle">Lesson</div>
                <button class="modal-close-btn" onclick="closeModal()" title="Close (ESC)">✕</button>
            </div>
            <div class="modal-body">
                <div class="markdown-content" id="modalContent"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>📚 Wiki: Lessons & Documentation | Lessons from fixed accessibility tickets</p>
    </footer>

    <script>
        let currentTheme = 'light';
        let firstRunContent = '';

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            currentTheme = savedTheme;
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');

            if (theme === 'dark') {
                html.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark-mode');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        });

        // Markdown Parser
        function parseMarkdown(markdown) {
            let html = markdown;

            // Escape HTML but preserve code blocks
            const codeBlocks = [];
            html = html.replace(/```[\s\S]*?```/g, (match) => {
                codeBlocks.push(match);
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Headings
            html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

            // Horizontal rules
            html = html.replace(/^---$/gm, '<hr>');

            // Bold and italic
            html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Links
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');

            // Blockquotes
            html = html.replace(/^&gt; (.*?)$/gm, '<blockquote>$1</blockquote>');

            // Unordered lists
            html = html.replace(/^\* (.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');

            // Ordered lists
            html = html.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');

            // Wrap consecutive list items
            html = html.replace(/(<li>.*<\/li>)/s, (match) => {
                return '<ul>' + match + '</ul>';
            });

            // Clean up list items
            html = html.replace(/<\/li>\n<li>/g, '</li>\n<li>');

            // Paragraphs
            const lines = html.split('\n\n');
            html = lines.map(line => {
                if (line.match(/^<[h|u|o|b|hr]/)) {
                    return line;
                }
                if (line.trim() === '') {
                    return '';
                }
                if (!line.match(/^<(h|ul|ol|li|hr|blockquote)/)) {
                    return '<p>' + line + '</p>';
                }
                return line;
            }).join('\n');

            // Restore code blocks
            codeBlocks.forEach((block, index) => {
                const codeMatch = block.match(/```(.*?)\n([\s\S]*?)```/);
                if (codeMatch) {
                    const language = codeMatch[1].trim();
                    const code = codeMatch[2].trim();
                    const replacement = '<pre><code>' + code + '</code></pre>';
                    html = html.replace(`__CODE_BLOCK_${index}__`, replacement);
                }
            });

            // Clean up
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(<h[1-3])/g, '$1');
            html = html.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ul)/g, '$1');
            html = html.replace(/(<\/ul>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ol)/g, '$1');
            html = html.replace(/(<\/ol>)<\/p>/g, '$1');
            html = html.replace(/<p>(<blockquote)/g, '$1');
            html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
            html = html.replace(/<p>(<pre)/g, '$1');
            html = html.replace(/(<\/pre>)<\/p>/g, '$1');
            html = html.replace(/<p>(<hr)/g, '$1');
            html = html.replace(/(<hr>)<\/p>/g, '$1');

            return html;
        }

        function openModal(title, content) {
            const modal = document.getElementById('contentModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');

            modalTitle.textContent = title;
            modalContent.innerHTML = parseMarkdown(content);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('contentModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close on background click
        document.getElementById('contentModal').addEventListener('click', (e) => {
            if (e.target.id === 'contentModal') {
                closeModal();
            }
        });

        // Close on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function loadLessons() {
            try {
                // Load FirstRun.md from agent/wiki/lessons
                const response = await fetch('../../agent/wiki/lessons/FirstRun.md');
                const content = await response.text();
                firstRunContent = content;

                // Parse and display lesson
                const container = document.getElementById('lessonsContainer');
                container.innerHTML = `
                    <div class="lesson-card" onclick="openModal('🚀 The A11y Fixer — End-to-End Flow', firstRunContent)">
                        <div class="lesson-title">🚀 The A11y Fixer — End-to-End Flow</div>
                        <div class="lesson-description">
                            Complete workflow of the accessibility fixing agent system: from audit triggers through violation routing and delivery.
                        </div>
                        <div>
                            <span class="lesson-tag">Agent Design</span>
                            <span class="lesson-tag">Workflow</span>
                            <span class="lesson-tag">WCAG</span>
                        </div>
                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">💡 Key Insights</div>
                        <div class="lesson-description">
                            From the FirstRun documentation:
                        </div>
                        <ul style="margin-left: 1.5rem; color: var(--color-text-secondary); font-size: 0.875rem;">
                            <li>Six MCP servers + 4 subagents coordinate accessibility fixes</li>
                            <li>Iterative refinement: QA score loops back to compliance planner if needed</li>
                            <li>Structured routing: auto-fixes vs. human review (HITL queue)</li>
                            <li>Real-time WCAG mapping via wcag-mcp (never training data)</li>
                            <li>HELM-style metrics for evaluation: clearance rate, calibration error</li>
                        </ul>
                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">📖 System Architecture</div>
                        <div class="lesson-description">
                            The agent system includes:
                        </div>
                        <ul style="margin-left: 1.5rem; color: var(--color-text-secondary); font-size: 0.875rem;">
                            <li><strong>Compliance Planner:</strong> WCAG mapping via wcag-mcp</li>
                            <li><strong>Codebase Compiler:</strong> Apply patches, run ng build/test</li>
                            <li><strong>QA Critic:</strong> 0-20 score with deterministic + LLM judgment</li>
                            <li><strong>Orchestrator:</strong> Route to auto or human (HITL)</li>
                        </ul>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading lessons:', error);
                document.getElementById('lessonsContainer').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Failed to Load Lessons</div>
                        <p>${error.message}</p>
                        <p style="font-size: 0.875rem; margin-top: 1rem;">Check if FirstRun.md exists at ../../agent/wiki/lessons/FirstRun.md</p>
                    </div>
                `;
            }
        }

        initTheme();
        loadLessons();
    </script>
</body>
</html>
