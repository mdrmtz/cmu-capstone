name: CI

# mdrmtz/dormant-to-live is the current active working branch - remove it
# from these lists once merged to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-agent:
    name: Agent test suite (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - run: pip install -e ".[dev]"

      # e2e tests (git/npm/docker-dependent) are excluded by pyproject.toml's
      # own `addopts = "-m 'not e2e'"` - this runs the same fast suite as local dev.
      - run: pytest

  build-dashboard-app:
    name: dashboard-app build (Angular SSR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      # dashboard-app is a git submodule (its own repo at
      # https://github.com/mdrmtz/dashboard-app) - it must be checked out
      # explicitly, otherwise the directory is empty and later steps
      # (npm cache lookup, npm ci, npm run build) fail.
      #
      # NOTE: we intentionally do not use `submodules: true` here. This repo
      # also references Hallucinate.io as a dynamic submodule that is not
      # (and should not be) pinned in .gitmodules - it can point at a
      # different repo/ref at different times and is managed outside of
      # git's submodule mechanism. `submodules: true` would try to
      # `git submodule update --init` it too and fail with "No url found for
      # submodule path 'Hallucinate.io' in .gitmodules". Instead, init only
      # the submodule this job actually needs.
      - uses: actions/checkout@v4

      - name: Checkout dashboard-app submodule
        working-directory: .
        run: git submodule update --init --depth=1 -- dashboard-app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - run: npm ci
      - run: npm run build
