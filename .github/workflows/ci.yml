name: CI

# mdrmtz/dormant-to-live is the current active working branch - remove it
# from these lists once merged to main.
on:
  push:
    branches: [main, mdrmtz/dormant-to-live]
  pull_request:
    branches: [main, mdrmtz/dormant-to-live]

jobs:
  test-agent:
    name: Agent test suite (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - run: pip install -e ".[dev]"

      # e2e tests (git/npm/docker-dependent) are excluded by pyproject.toml's
      # own `addopts = "-m 'not e2e'"` - this runs the same fast suite as local dev.
      - run: pytest

# dashboard-app is its own separate repo (mdrmtz/dashboard-app, submodule
# here) - its build lives in that repo's own .github/workflows/ci.yml, not
# here, so it runs against dashboard-app's actual latest commits (not just
# whatever commit this repo's submodule pointer happens to be pinned to)
# and needs no cross-repo PAT.

