[project]
name = "a11y-fixer"
version = "0.1.0"
description = "Autonomous WCAG 2.2 AA remediation agent for Angular SPAs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "deepagents>=0.7.0",
    "langchain>=1.3.0",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.0",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.0",
    "langchain-mcp-adapters>=0.3.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
a11y-fixer = "a11y_fixer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests that require git/npm/docker and are skipped by default",
]
asyncio_mode = "auto"
